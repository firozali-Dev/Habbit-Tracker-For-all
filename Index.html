<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0d9488" />
  <title>Habit Tracker Pro — Personal Habit Operating System</title>
  <style>

    :root {
      --bg-app: #f3f6f5;
      --bg-mesh-1: rgba(13, 148, 136, 0.08);
      --bg-mesh-2: rgba(16, 185, 129, 0.07);
      --bg-surface: rgba(255, 255, 255, 0.92);
      --bg-surface-solid: #ffffff;
      --bg-surface-2: #f7faf9;
      --bg-hover: #ebf3f0;
      --text-primary: #0b131e;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: rgba(203, 213, 225, 0.72);
      --border-subtle: rgba(226, 232, 240, 0.65);

      --accent-primary: #0d9488;
      --accent-primary-hover: #0f766e;
      --accent-secondary: #10b981;
      --accent-glow: rgba(13, 148, 136, 0.25);
      --accent-soft: rgba(13, 148, 136, 0.11);
      --accent-soft-text: #0f766e;
      --accent-gradient: linear-gradient(135deg, #0d9488 0%, #10b981 55%, #34d399 100%);

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.14);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.13);
      --info: #3b82f6;
      --info-bg: rgba(59, 130, 246, 0.12);

      --heat-0: #e7ecea;
      --heat-1: #99f6e4;
      --heat-2: #5eead4;
      --heat-3: #14b8a6;
      --heat-4: #0f766e;

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.03);
      --shadow-sm: 0 4px 14px -2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 12px 28px -4px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 24px 54px -8px rgba(15, 23, 42, 0.16);
      --inner-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 0.85);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --sidebar-width: 268px;
      --sidebar-collapsed: 80px;
      --topbar-height: 68px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg-app: #080d10;
      --bg-mesh-1: rgba(20, 184, 166, 0.10);
      --bg-mesh-2: rgba(16, 185, 129, 0.07);
      --bg-surface: rgba(17, 26, 31, 0.90);
      --bg-surface-solid: #111a1f;
      --bg-surface-2: #162229;
      --bg-hover: #1d2c35;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(45, 65, 77, 0.65);
      --border-subtle: rgba(35, 51, 61, 0.6);

      --accent-primary: #14b8a6;
      --accent-primary-hover: #2dd4bf;
      --accent-secondary: #34d399;
      --accent-glow: rgba(20, 184, 166, 0.28);
      --accent-soft: rgba(20, 184, 166, 0.16);
      --accent-soft-text: #5eead4;

      --success-bg: rgba(16, 185, 129, 0.20);
      --warning-bg: rgba(245, 158, 11, 0.20);
      --danger-bg: rgba(239, 68, 68, 0.20);
      --info-bg: rgba(59, 130, 246, 0.18);

      --heat-0: #18242b;
      --heat-1: #115e59;
      --heat-2: #0d9488;
      --heat-3: #14b8a6;
      --heat-4: #5eead4;

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 14px 32px rgba(0, 0, 0, 0.48);
      --shadow-lg: 0 28px 60px rgba(0, 0, 0, 0.65);
      --inner-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      background-image:
        radial-gradient(at 12% 8%, var(--bg-mesh-1) 0px, transparent 48%),
        radial-gradient(at 88% 18%, var(--bg-mesh-2) 0px, transparent 45%);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; touch-action: manipulation; }


    .pc-only-shell { display: flex; min-height: 100vh; width: 100%; }
    .mobile-only-shell { display: none; min-height: 100dvh; width: 100%; flex-direction: column; }

    @media (max-width: 768px) {
      .pc-only-shell { display: none !important; }
      .mobile-only-shell { display: flex !important; }
    }


    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm), var(--inner-highlight);
      min-width: 0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-title { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
    .card-subtitle { font-size: 12.5px; color: var(--text-secondary); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 8px 15px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13.5px;
      transition: all 0.2s var(--spring);
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn-secondary {
      background: var(--bg-surface-solid);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .btn-soft { background: var(--accent-soft); color: var(--accent-soft-text); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { min-height: 34px; padding: 5px 11px; font-size: 12px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-solid);
      transition: all 0.2s var(--spring);
    }
    .icon-btn:active { transform: scale(0.93); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 600;
      background: var(--bg-surface-solid);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .badge-streak { background: var(--warning-bg); border-color: transparent; color: #b45309; }
    [data-theme="dark"] .badge-streak { color: #fbbf24; }
    .badge-reminder { background: var(--info-bg); border-color: transparent; color: var(--info); }
    .badge-paused { background: var(--danger-bg); border-color: transparent; color: var(--danger); }

    .check-btn {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 9px;
      border: 2px solid var(--border-color);
      background: var(--bg-surface-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 15px;
      font-weight: 800;
      flex-shrink: 0;
      transition: all 0.24s var(--spring);
    }
    .check-btn.checked {
      background: var(--accent-gradient);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 3px 10px var(--accent-glow);
    }

    .text-input, .textarea-input, .select-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-2);
      font-size: 14px;
      outline: none;
    }
    .text-input, .select-input { min-height: 40px; }
    .textarea-input { min-height: 105px; border-radius: var(--radius-md); resize: vertical; }
    .text-input:focus, .textarea-input:focus, .select-input:focus {
      border-color: var(--accent-primary);
      background: var(--bg-surface-solid);
    }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }


    .pc-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 40;
      transition: width 0.3s var(--ease-out);
      padding: 20px 14px;
    }
    .pc-sidebar.collapsed { width: var(--sidebar-collapsed); }
    .pc-sidebar.collapsed .brand-text,
    .pc-sidebar.collapsed .nav-label,
    .pc-sidebar.collapsed .sidebar-user-info { display: none; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 8px 18px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 11px;
      background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 17px; flex-shrink: 0;
    }
    .brand-title { font-weight: 800; font-size: 15.5px; display: flex; align-items: center; gap: 6px; }
    .brand-badge {
      font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 5px;
      background: var(--accent-soft); color: var(--accent-soft-text); text-transform: uppercase;
    }
    .brand-sub { font-size: 11px; color: var(--text-muted); }

    .nav-list { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 13px; border-radius: var(--radius-md);
      color: var(--text-secondary); font-weight: 500; font-size: 14px;
      transition: all 0.2s; white-space: nowrap;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent-soft-text); font-weight: 600; }

    .sidebar-footer { border-top: 1px solid var(--border-subtle); padding-top: 12px; }
    .user-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: var(--radius-md);
      background: var(--bg-surface-2); border: 1px solid var(--border-subtle);
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent-gradient); color: #fff;
      font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .pc-main {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: margin-left 0.3s var(--ease-out);
    }
    .pc-sidebar.collapsed ~ .pc-main { margin-left: var(--sidebar-collapsed); }

    .pc-topbar {
      height: var(--topbar-height);
      background: var(--bg-surface);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-color);
      padding: 0 26px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 30;
    }

    .pc-content {
      padding: 24px 26px 60px;
      max-width: 1420px;
      width: 100%;
      margin: 0 auto;
    }

    .pc-hero {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 22px 26px;
      margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      box-shadow: var(--shadow-md);
      position: relative; overflow: hidden;
    }
    .pc-hero::before {
      content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 5px;
      background: var(--accent-gradient);
    }

    .pc-kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 15px 16px;
      display: flex; flex-direction: column; gap: 4px;
      box-shadow: var(--shadow-xs);
    }
    .kpi-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .kpi-value { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
    .kpi-meta { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .pc-dash-grid { display: grid; grid-template-columns: 1.65fr 1fr; gap: 20px; align-items: start; }
    .pc-2col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .pc-settings-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

    @media (max-width: 1200px) {
      .pc-kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .pc-settings-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 960px) {
      .pc-dash-grid, .pc-2col-grid, .pc-settings-grid { grid-template-columns: 1fr; }
    }

    .pc-habit-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 15px; border-radius: var(--radius-md);
      background: var(--bg-surface-2); border: 1px solid var(--border-subtle);
      margin-bottom: 9px;
    }
    .pc-habit-row.completed .habit-name { text-decoration: line-through; color: var(--text-muted); }

    /* PC Calendar */
    .pc-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .cal-weekday { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted); padding-bottom: 4px; text-transform: uppercase; }
    .pc-cal-day {
      aspect-ratio: 1 / 0.85; min-height: 62px;
      border-radius: var(--radius-md); border: 1px solid var(--border-color);
      background: var(--bg-surface-2); padding: 8px;
      display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: transform 0.18s;
    }
    .pc-cal-day:hover:not(.empty) { transform: translateY(-2px); border-color: var(--accent-primary); }
    .pc-cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
    .pc-cal-day.today { border: 2px solid var(--accent-primary); }
    .pc-cal-day.status-complete { background: var(--success-bg); border-color: rgba(16,185,129,0.4); }
    .pc-cal-day.status-partial { background: var(--warning-bg); border-color: rgba(245,158,11,0.4); }
    .pc-cal-day.status-missed { background: var(--danger-bg); border-color: rgba(239,68,68,0.35); }
    .pc-cal-day.status-unscheduled { opacity: 0.55; }


    .mob-header {
      position: sticky;
      top: 0;
      z-index: 35;
      background: var(--bg-surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-color);
      padding: calc(8px + var(--safe-top)) 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mob-header-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .mob-logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--accent-gradient);
      color: #fff; font-weight: 800; font-size: 15px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .mob-title-wrap h1 {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .mob-title-wrap span {
      font-size: 11px;
      color: var(--text-secondary);
      display: block;
    }

    .mob-body {
      flex: 1;
      padding: 12px 12px calc(82px + var(--safe-bottom));
      width: 100%;
    }

  
    .mob-summary-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-xs);
    }

    .mob-summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .mob-ring-mini {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mob-ring-svg {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }
    .mob-ring-svg svg { transform: rotate(-90deg); width: 48px; height: 48px; }
    .mob-ring-svg circle { fill: none; stroke-width: 5.5; }
    .mob-ring-svg .ring-bg { stroke: var(--border-color); }
    .mob-ring-svg .ring-fill { stroke: var(--accent-primary); stroke-linecap: round; transition: stroke-dashoffset 0.5s; }
    .mob-ring-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11.5px; font-weight: 800;
    }

    .mob-kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding-top: 9px;
      border-top: 1px solid var(--border-subtle);
    }

    .mob-kpi-pill {
      background: var(--bg-surface-2);
      border-radius: 10px;
      padding: 6px 4px;
      text-align: center;
    }
    .mob-kpi-pill strong { display: block; font-size: 13.5px; font-weight: 800; color: var(--text-primary); line-height: 1.2; }
    .mob-kpi-pill span { font-size: 9.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }


    .mob-filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .mob-filter-bar input,
    .mob-filter-bar select {
      min-height: 36px;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface-solid);
    }
    .mob-filter-bar input { flex: 1; min-width: 0; }
    .mob-filter-bar select { max-width: 125px; }


    .mob-habit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 340px) {
      .mob-habit-grid { grid-template-columns: 1fr; }
    }

    .mob-habit-tile {
      background: var(--bg-surface-solid);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      transition: transform 0.18s var(--spring), border-color 0.2s, background-color 0.2s;
      user-select: none;
    }

    .mob-habit-tile:active {
      transform: scale(0.96);
    }

    .mob-habit-tile.completed {
      background: var(--success-bg);
      border-color: var(--success);
    }

    .mob-tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .mob-tile-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .mob-tile-check {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      background: var(--bg-surface-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: transparent;
      flex-shrink: 0;
    }

    .mob-habit-tile.completed .mob-tile-check {
      background: var(--accent-gradient);
      border-color: transparent;
      color: #fff;
    }

    .mob-tile-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const initial = getDefaultState();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
          }
          const parsed = JSON.parse(raw);
          const def = getDefaultState();
          return {
            settings: { ...def.settings, ...(parsed.settings || {}) },
            categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : def.categories,
            customIcons: Array.isArray(parsed.customIcons) ? parsed.customIcons : [],
            habits: Array.isArray(parsed.habits) ? parsed.habits : [],
            completions: parsed.completions && typeof parsed.completions === "object" ? parsed.completions : {},
            recentLog: Array.isArray(parsed.recentLog) ? parsed.recentLog : [],
            weeklyReviews: parsed.weeklyReviews && typeof parsed.weeklyReviews === "object" ? parsed.weeklyReviews : {},
            notes: Array.isArray(parsed.notes) ? parsed.notes : []
          };
        } catch (e) {
          return getDefaultState();
        }
      }

      function toDateStr(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function parseDateStr(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function addDays(d, n) {
        const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        c.setDate(c.getDate() + n);
        return c;
      }
      function getTodayStr() { return toDateStr(new Date()); }
      function formatDisplayDate(dateStr, format) {
        const d = parseDateStr(dateStr);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const mShort = d.toLocaleDateString("en-US", { month: "short" });
        if (format === "DD/MM/YYYY") return `${dd}/${mm}/${yyyy}`;
        if (format === "MM/DD/YYYY") return `${mm}/${dd}/${yyyy}`;
        if (format === "YYYY-MM-DD") return `${yyyy}-${mm}-${dd}`;
        return `${mShort} ${dd}, ${yyyy}`;
      }
      function generateId() { return "hab_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7); }
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str == null ? "" : String(str);
        return div.innerHTML;
      }


      function isHabitScheduledOn(habit, dateStr) {
        if (habit.paused) return false;
        if (habit.startDate && dateStr < habit.startDate) return false;
        const dow = parseDateStr(dateStr).getDay();
        const days = Array.isArray(habit.daysOfWeek) && habit.daysOfWeek.length ? habit.daysOfWeek : [0,1,2,3,4,5,6];
        return days.includes(dow);
      }

      function isHabitCompletedOn(habitId, dateStr) {
        const list = state.completions[dateStr];
        return Array.isArray(list) && list.includes(habitId);
      }

      function getHabitStats(habit) {
        const todayStr = getTodayStr();
        const todayDate = parseDateStr(todayStr);
        const startDate = habit.startDate ? parseDateStr(habit.startDate) : todayDate;
        const effStart = startDate > todayDate ? todayDate : startDate;

        let totalScheduled = 0, totalCompleted = 0, missedDays = 0, longestStreak = 0, running = 0;
        let cur = new Date(effStart);
        while (cur <= todayDate) {
          const cStr = toDateStr(cur);
          const sched = isHabitScheduledOn(habit, cStr);
          const done = isHabitCompletedOn(habit.id, cStr);
          if (sched) {
            totalScheduled++;
            if (done) {
              totalCompleted++;
              running++;
              if (running > longestStreak) longestStreak = running;
            } else if (cStr < todayStr) {
              missedDays++;
              running = 0;
            }
          } else if (done) {
            totalCompleted++;
          }
          cur = addDays(cur, 1);
        }

        let currentStreak = 0;
        let back = new Date(todayDate);
        let guard = 0;
        while (back >= effStart && guard < 3650) {
          const bStr = toDateStr(back);
          const sched = isHabitScheduledOn(habit, bStr);
          const done = isHabitCompletedOn(habit.id, bStr);
          if (sched) {
            if (done) currentStreak++;
            else if (bStr === todayStr) {}
            else break;
          }
          back = addDays(back, -1);
          guard++;
        }

        const rate = totalScheduled > 0 ? Math.min(100, Math.round((totalCompleted / totalScheduled) * 100)) : 0;
        return { currentStreak, longestStreak, totalCompleted, totalScheduled, missedDays, rate };
      }

      function getDateSummary(dateStr) {
        const active = state.habits.filter(h => !h.paused);
        const sched = active.filter(h => isHabitScheduledOn(h, dateStr));
        const done = sched.filter(h => isHabitCompletedOn(h.id, dateStr));
        const pct = sched.length > 0 ? Math.round((done.length / sched.length) * 100) : 0;
        return { scheduledCount: sched.length, completedCount: done.length, pct };
      }

      function getRangeRate(startObj, endObj) {
        let sTotal = 0, dTotal = 0, cur = new Date(startObj);
        while (cur <= endObj) {
          const sum = getDateSummary(toDateStr(cur));
          sTotal += sum.scheduledCount;
          dTotal += sum.completedCount;
          cur = addDays(cur, 1);
        }
        return sTotal > 0 ? Math.round((dTotal / sTotal) * 100) : 0;
      }

      function getStartOfWeek(dObj) {
        const ws = Number(state.settings.weekStart);
        const d = new Date(dObj.getFullYear(), dObj.getMonth(), dObj.getDate());
        const diff = (d.getDay() - ws + 7) % 7;
        d.setDate(d.getDate() - diff);
        return d;
      }

      function applyTheme() {
        let mode = state.settings.theme;
        if (mode === "system") {
          mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", mode);
      }


      function computeViewData() {
        const todayStr = getTodayStr();
        const todayObj = new Date();
        const todaySum = getDateSummary(todayStr);
        const activeHabits = state.habits.filter(h => !h.paused);
        const pausedCount = state.habits.length - activeHabits.length;

        let bestCurrentStreak = 0, bestStreakHabitName = "No active streak";
        activeHabits.forEach(h => {
          const st = getHabitStats(h);
          if (st.currentStreak > bestCurrentStreak) {
            bestCurrentStreak = st.currentStreak;
            bestStreakHabitName = h.name;
          }
        });

        const weekStart = getStartOfWeek(todayObj);
        const weeklyPct = getRangeRate(weekStart, todayObj);
        const monthStart = new Date(todayObj.getFullYear(), todayObj.getMonth(), 1);
        const monthlyPct = getRangeRate(monthStart, todayObj);

        const dayOfYear = Math.floor((todayObj - new Date(todayObj.getFullYear(), 0, 0)) / 86400000);
        const quote = MOTIVATIONAL_QUOTES[dayOfYear % MOTIVATIONAL_QUOTES.length];

        return {
          todayStr,
          todayObj,
          todaySum,
          activeHabits,
          pausedCount,
          bestCurrentStreak,
          bestStreakHabitName,
          weeklyPct,
          monthlyPct,
          quote
        };
      }

      function getFilteredDashboardHabits(todayStr) {
        let list = state.habits.filter(h => !h.paused);
        if (!showAllHabits) list = list.filter(h => isHabitScheduledOn(h, todayStr));
        if (filterSearch) {
          const q = filterSearch.toLowerCase();
          list = list.filter(h => h.name.toLowerCase().includes(q) || (h.target || "").toLowerCase().includes(q));
        }
        if (filterCategory !== "ALL") list = list.filter(h => h.category === filterCategory);
        if (filterStatus === "COMPLETED") list = list.filter(h => isHabitCompletedOn(h.id, todayStr));
        if (filterStatus === "PENDING") list = list.filter(h => !isHabitCompletedOn(h.id, todayStr));
        return list;
      }

      function buildMobileCalendarHTML() {
        const year = calendarViewDate.getFullYear();
        const month = calendarViewDate.getMonth();
        const todayStr = getTodayStr();
        const monthTitle = new Date(year, month, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" });
        const ws = Number(state.settings.weekStart);
        const wDays = ws === 1 ? ["M", "T", "W", "T", "F", "S", "S"] : ["S", "M", "T", "W", "T", "F", "S"];

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const offset = (firstDay.getDay() - ws + 7) % 7;

        let cells = wDays.map(d => `<div class="mob-cal-wd">${d}</div>`).join("");
        for (let i = 0; i < offset; i++) cells += `<div class="mob-cal-cell empty"></div>`;

        for (let day = 1; day <= lastDay.getDate(); day++) {
          const dStr = toDateStr(new Date(year, month, day));
          const isToday = dStr === todayStr;
          const isFuture = dStr > todayStr;
          let cls = "status-unscheduled", ratio = "";

          if (calendarFilterHabit === "ALL") {
            const sum = getDateSummary(dStr);
            if (sum.scheduledCount > 0) {
              ratio = `${sum.completedCount}/${sum.scheduledCount}`;
              if (sum.completedCount === sum.scheduledCount) cls = "status-complete";
              else if (sum.completedCount > 0) cls = "status-partial";
              else if (!isFuture) cls = "status-missed";
            }
          } else {
            const h = state.habits.find(x => x.id === calendarFilterHabit);
            if (h) {
              const sched = isHabitScheduledOn(h, dStr);
              const done = isHabitCompletedOn(h.id, dStr);
              if (done) { cls = "status-complete"; ratio = "✓"; }
              else if (sched && !isFuture) { cls = "status-missed"; ratio = "✕"; }
            }
          }

          cells += `
            <div class="mob-cal-cell ${cls} ${isToday ? 'today' : ''}" onclick="window.HTP.openDayModal('${dStr}')">
              <span class="mob-cal-num">${day}</span>
              <span class="mob-cal-ratio">${ratio}</span>
            </div>
          `;
        }

        return `
          <div class="mob-cal-card">
            <div class="mob-cal-head">
              <div style="display:flex; align-items:center; gap:6px;">
                <button class="icon-btn" style="width:34px; height:34px; min-width:34px;" onclick="window.HTP.shiftMonth(-1)">◀</button>
                <span class="mob-cal-month">${monthTitle}</span>
                <button class="icon-btn" style="width:34px; height:34px; min-width:34px;" onclick="window.HTP.shiftMonth(1)">▶</button>
              </div>
              <select class="select-input" style="min-height:34px; padding:4px 8px; font-size:12px; max-width:145px;" onchange="window.HTP.setCalHabit(this.value)">
                <option value="ALL">All Habits</option>
                ${state.habits.map(h => `<option value="${h.id}" ${calendarFilterHabit === h.id ? 'selected' : ''}>${escapeHtml(h.icon)} ${escapeHtml(h.name)}</option>`).join("")}
              </select>
            </div>
            <div class="mob-cal-grid">${cells}</div>
            <p style="font-size:11px; color:var(--text-muted); margin-top:8px; text-align:center;">Tap any date to tick or edit completions</p>
          </div>
        `;
      }

          const isToday = dStr === todayStr;
          const isFuture = dStr > todayStr;
          let cls = "status-unscheduled", lbl = "—";

          if (calendarFilterHabit === "ALL") {
            const sum = getDateSummary(dStr);
            if (sum.scheduledCount > 0) {
              lbl = `${sum.completedCount}/${sum.scheduledCount}`;
              if (sum.completedCount === sum.scheduledCount) cls = "status-complete";
              else if (sum.completedCount > 0) cls = "status-partial";
              else if (!isFuture) cls = "status-missed";
            }
          } else {
            const h = state.habits.find(x => x.id === calendarFilterHabit);
            if (h) {
              const sched = isHabitScheduledOn(h, dStr);
              const done = isHabitCompletedOn(h.id, dStr);
              if (done) { cls = "status-complete"; lbl = "Done ✓"; }
              else if (sched && !isFuture) { cls = "status-missed"; lbl = "Missed"; }
              else if (sched) lbl = "Scheduled";
            }
          }

          cells += `
            <div class="pc-cal-day ${cls} ${isToday ? 'today' : ''}" onclick="window.HTP.openDayModal('${dStr}')">
              <div style="font-weight:700; font-size:13px;">${day}</div>
              <div style="font-size:11px; font-weight:600; color:var(--text-secondary);">${lbl}</div>
            </div>
          `;
        }

        return `
          <div class="card" style="margin-bottom:20px;">
            <div class="card-header">
              <div style="display:flex; align-items:center; gap:10px;">
                <button class="icon-btn" onclick="window.HTP.shiftMonth(-1)">◀</button>
                <span style="font-size:17px; font-weight:800; min-width:160px; text-align:center;">${monthLabel}</span>
                <button class="icon-btn" onclick="window.HTP.shiftMonth(1)">▶</button>
                <button class="btn btn-secondary btn-sm" onclick="window.HTP.resetMonth()">Today</button>
              </div>
              <select class="select-input" style="max-width:260px;" onchange="window.HTP.setCalHabit(this.value)">
                <option value="ALL">All Scheduled Habits (Combined)</option>
                ${state.habits.map(h => `<option value="${h.id}" ${calendarFilterHabit === h.id ? 'selected' : ''}>${escapeHtml(h.icon)} ${escapeHtml(h.name)}</option>`).join("")}
              </select>
            </div>
            <div class="pc-cal-grid">${cells}</div>
          </div>
        `;
      }


      function buildHeatmapCardHTML() {
        const todayObj = parseDateStr(getTodayStr());
        let cur = addDays(todayObj, -364);
        let cells = "";
        while (cur <= todayObj) {
          const cStr = toDateStr(cur);
          const sum = getDateSummary(cStr);
          let lvl = "";
          if (sum.scheduledCount > 0 && sum.completedCount > 0) {
            if (sum.pct >= 100) lvl = "heat-4";
            else if (sum.pct >= 70) lvl = "heat-3";
            else if (sum.pct >= 40) lvl = "heat-2";
            else lvl = "heat-1";
          }
          cells += `<div class="heat-cell ${lvl}" title="${formatDisplayDate(cStr, state.settings.dateFormat)}: ${sum.pct}%"></div>`;
          cur = addDays(cur, 1);
        }

        return `
          <div class="card">
            <div class="card-header">
              <div><div class="card-title">🟩 Annual Consistency Heatmap</div><div class="card-subtitle">Last 365 days completion density</div></div>
            </div>
            <div class="heatmap-wrapper"><div class="heatmap-grid">${cells}</div></div>
          </div>
        `;
      }

      function buildAnalyticsHTML(data, isPc = false) {
        let totalSched = 0, totalDone = 0, longestEver = 0, longestName = "—";
        let bestH = null, worstH = null;

        const metrics = data.activeHabits.map(h => {
          const st = getHabitStats(h);
          totalSched += st.totalScheduled;
          totalDone += st.totalCompleted;
          if (st.longestStreak > longestEver) { longestEver = st.longestStreak; longestName = h.name; }
          if (!bestH || st.rate > bestH.st.rate) bestH = { h, st };
          if (!worstH || st.missedDays > worstH.st.missedDays) worstH = { h, st };
          return { h, st };
        });

        const overallPct = totalSched > 0 ? Math.min(100, Math.round((totalDone / totalSched) * 100)) : 0;

        const dailyBars = [];
        for (let i = 6; i >= 0; i--) {
          const d = addDays(data.todayObj, -i);
          dailyBars.push({ lbl: d.toLocaleDateString("en-US", { weekday: "short" }), pct: getDateSummary(toDateStr(d)).pct });
        }

        const weeklyBars = [];
        const cwStart = getStartOfWeek(data.todayObj);
        for (let w = 5; w >= 0; w--) {
          const ws = addDays(cwStart, -w * 7);
          const we = w === 0 ? data.todayObj : addDays(ws, 6);
          weeklyBars.push({ lbl: w === 0 ? "Now" : ws.toLocaleDateString("en-US", { month: "short", day: "numeric" }), pct: getRangeRate(ws, we) });
        }

        const renderBars = (arr) => arr.map(x => `
          <div class="bar-col">
            <div class="bar-val">${x.pct}%</div>
            <div class="bar-fill" style="height:${Math.max(4, x.pct * 1.25)}px;"></div>
            <div class="bar-lbl">${x.lbl}</div>
          </div>
        `).join("");

        return `
          <div style="display:grid; grid-template-columns:repeat(${isPc ? 4 : 2}, minmax(0,1fr)); gap:10px; margin-bottom:16px;">
            <div class="kpi-card"><div class="kpi-top"><span>Consistency</span><span>📈</span></div><div class="kpi-value">${overallPct}%</div><div class="kpi-meta">All-time rate</div></div>
            <div class="kpi-card"><div class="kpi-top"><span>Best Streak</span><span>🏅</span></div><div class="kpi-value">${longestEver}d</div><div class="kpi-meta">${escapeHtml(longestName)}</div></div>
            <div class="kpi-card"><div class="kpi-top"><span>Top Habit</span><span>🌟</span></div><div class="kpi-value" style="font-size:15px;">${bestH ? escapeHtml(bestH.h.icon + ' ' + bestH.h.name) : '—'}</div><div class="kpi-meta">${bestH ? bestH.st.rate + '%' : 'No data'}</div></div>
            <div class="kpi-card"><div class="kpi-top"><span>Most Missed</span><span>⚠️</span></div><div class="kpi-value" style="font-size:15px;">${worstH && worstH.st.missedDays > 0 ? escapeHtml(worstH.h.icon + ' ' + worstH.h.name) : 'None'}</div><div class="kpi-meta">${worstH ? worstH.st.missedDays + ' missed' : '0 missed'}</div></div>
          </div>

          <div class="${isPc ? 'pc-2col-grid' : ''}" style="display:grid; gap:14px;">
            <div class="card"><div class="card-header"><div class="card-title">Last 7 Days</div></div><div class="bar-chart">${renderBars(dailyBars)}</div></div>
            <div class="card"><div class="card-header"><div class="card-title">Last 6 Weeks</div></div><div class="bar-chart">${renderBars(weeklyBars)}</div></div>
            <div class="card" style="${isPc ? 'grid-column:1/-1;' : ''}">
              <div class="card-header"><div class="card-title">Habit-Wise Performance</div></div>
              ${metrics.length === 0 ? `<p style="font-size:13px; color:var(--text-muted);">No active habits yet.</p>` :
                metrics.sort((a, b) => b.st.rate - a.st.rate).map(({ h, st }) => `
                  <div class="perf-item">
                    <div class="perf-head"><span>${escapeHtml(h.icon)} ${escapeHtml(h.name)}</span><span>${st.rate}% · 🔥 ${st.currentStreak}d</span></div>
                    <div class="progress-track"><div class="progress-fill" style="width:${st.rate}%;"></div></div>
                  </div>
                `).join("")}
            </div>
          </div>
        `;
      }

      function triggerConfetti() {
        const canvas = document.getElementById("confetti-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const colors = ["#0d9488", "#10b981", "#34d399", "#f59e0b", "#3b82f6"];
        const pieces = Array.from({ length: 80 }, () => ({
          x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
          w: 7, h: 4, color: colors[Math.floor(Math.random() * colors.length)],
          vy: Math.random() * 3 + 2.5, vx: (Math.random() - 0.5) * 2
        }));
        let f = 0;
        function step() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(p => { p.x += p.vx; p.y += p.vy; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h); });
          if (++f < 110) requestAnimationFrame(step);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        step();
      }

      function showToast(msg) {
        const c = document.getElementById("toastContainer");
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(() => el.remove(), 2300);
      }

      window.HTP = {
        openModal: () => openHabitModal(),
        editHabit: (id) => openHabitModal(id),
        openDayModal: (d) => openDayModal(d),
        toggle: (id, dateStr) => {
          const h = state.habits.find(x => x.id === id);
          if (!h) return;
          if (!Array.isArray(state.completions[dateStr])) state.completions[dateStr] = [];
          const idx = state.completions[dateStr].indexOf(id);
          if (idx === -1) {
            state.completions[dateStr].push(id);
            state.recentLog.unshift({ habitName: h.name, icon: h.icon, date: dateStr, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
            if (state.recentLog.length > 20) state.recentLog.pop();
            showToast(`✅ ${h.name}`);
          } else {
            state.completions[dateStr].splice(idx, 1);
            if (state.completions[dateStr].length === 0) delete state.completions[dateStr];
            showToast(`↩️ ${h.name}`);
          }
          saveState();
          renderApp();
          if (dateStr === getTodayStr()) {
            const sum = getDateSummary(dateStr);
            if (sum.scheduledCount > 0 && sum.completedCount === sum.scheduledCount && !celebratedToday) {
              celebratedToday = true;
              triggerConfetti();
              showToast("🎉 All daily habits completed!");
            } else if (sum.completedCount < sum.scheduledCount) {
              celebratedToday = false;
            }
          }
        },
        toggleDayModal: (id, dateStr) => {
          window.HTP.toggle(id, dateStr);
          openDayModal(dateStr);
        },
        togglePause: (id) => {
          const h = state.habits.find(x => x.id === id);
          if (!h) return;
          h.paused = !h.paused;
          saveState();
          renderApp();
        },
        deleteHabit: (id) => {
          const h = state.habits.find(x => x.id === id);
          if (!h || !confirm(`Delete "${h.name}"?`)) return;
          state.habits = state.habits.filter(x => x.id !== id);
          saveState();
          renderApp();
        },
        toggleShowAll: () => { showAllHabits = !showAllHabits; renderApp(); },
        setSearch: (v) => { filterSearch = v; renderApp(); },
        setCategory: (v) => { filterCategory = v; renderApp(); },
        setStatus: (v) => { filterStatus = v; renderApp(); },
        setManageState: (v) => { manageFilterState = v; renderApp(); },
        setCalHabit: (v) => { calendarFilterHabit = v; renderApp(); },
        shiftMonth: (delta) => { calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + delta, 1); renderApp(); },
        resetMonth: () => { calendarViewDate = new Date(); renderApp(); },
        saveReview: () => {
          const wk = toDateStr(getStartOfWeek(new Date()));
          state.weeklyReviews[wk] = {
            wins: document.getElementById("revWins").value,
            blockers: document.getElementById("revBlockers").value,
            focus: document.getElementById("revFocus").value
          };
          saveState();
          showToast("🧭 Review saved!");
        },
        addNote: () => {
          const title = document.getElementById("noteTitle").value.trim() || "Note";
          const body = document.getElementById("noteBody").value.trim();
          if (!body) return;
          state.notes.unshift({ id: generateId(), title, body, createdAt: getTodayStr() });
          saveState();
          renderApp();
          showToast("🗒️ Note saved!");
        },
        deleteNote: (id) => {
          if (!confirm("Delete this note?")) return;
          state.notes = state.notes.filter(n => n.id !== id);
          saveState();
          renderApp();
        },
        saveSettings: () => {
          state.settings.userName = document.getElementById("setUName").value.trim();
          state.settings.theme = document.getElementById("setUTheme").value;
          state.settings.weekStart = Number(document.getElementById("setUWeek").value);
          state.settings.dateFormat = document.getElementById("setUDate").value;
          saveState();
          renderApp();
          showToast("⚙️ Settings saved!");
        },
        addCat: () => {
          const v = document.getElementById("newCatIn").value.trim();
          if (v && !state.categories.includes(v)) { state.categories.push(v); saveState(); renderApp(); }
        },
        removeCat: (c) => { state.categories = state.categories.filter(x => x !== c); saveState(); renderApp(); },
        addIcon: () => {
          const v = document.getElementById("newIcIn").value.trim();
          if (v && !state.customIcons.includes(v)) { state.customIcons.push(v); saveState(); renderApp(); }
        },
        removeIcon: (ic) => { state.customIcons = state.customIcons.filter(x => x !== ic); saveState(); renderApp(); },
        exportJson: () => {
          state.settings.lastBackup = formatDisplayDate(getTodayStr(), state.settings.dateFormat);
          saveState();
          renderApp();
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `HabitTrackerPro_Backup_${getTodayStr()}.json`;
          a.click();
        },
        importJson: (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = (ev) => {
            try {
              const imp = JSON.parse(ev.target.result);
              if (!imp || !Array.isArray(imp.habits)) throw new Error();
              if (!confirm("Replace current data with this backup?")) return;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(imp));
              state = loadState();
              renderApp();
              showToast("✅ Backup restored!");
            } catch (err) { alert("Invalid JSON backup file."); }
          };
          r.readAsText(f);
        },
        resetAll: () => {
          if (!confirm("Delete ALL habits and history permanently?")) return;
          localStorage.removeItem(STORAGE_KEY);
          state = loadState();
          renderApp();
          showToast("🔄 Data reset.");
        }
      };

      /* ------------------------------------------------------------------------
         EVENT BINDINGS & VIEWPORT SWITCH LISTENER
         ------------------------------------------------------------------------ */
      document.querySelectorAll(".nav-item, .mob-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeView = btn.dataset.view;
          window.scrollTo({ top: 0 });
          renderApp();
        });
      });

      document.getElementById("pcSidebarToggleBtn").addEventListener("click", () => {
        document.getElementById("pcSidebar").classList.toggle("collapsed");
      });

      const toggleTheme = () => {
        const cur = document.documentElement.getAttribute("data-theme");
        state.settings.theme = cur === "dark" ? "light" : "dark";
        saveState();
        renderApp();
      };
      document.getElementById("pcThemeBtn").addEventListener("click", toggleTheme);
      document.getElementById("mobThemeBtn").addEventListener("click", toggleTheme);

      document.getElementById("pcNewHabitBtn").addEventListener("click", () => openHabitModal());
      document.getElementById("mobNewHabitBtn").addEventListener("click", () => openHabitModal());
      document.getElementById("closeHabitModalBtn").addEventListener("click", () => document.getElementById("habitModalBackdrop").classList.remove("open"));
      document.getElementById("cancelHabitModalBtn").addEventListener("click", () => document.getElementById("habitModalBackdrop").classList.remove("open"));
      document.getElementById("closeDayModalBtn").addEventListener("click", () => document.getElementById("dayModalBackdrop").classList.remove("open"));
      document.getElementById("doneDayModalBtn").addEventListener("click", () => document.getElementById("dayModalBackdrop").classList.remove("open"));

      document.getElementById("iconSearchInput").addEventListener("input", renderIconStudio);
      document.getElementById("habitScheduleTypeInput").addEventListener("change", (e) => {
        document.getElementById("customDaysGroup").style.display = e.target.value === "custom" ? "block" : "none";
      });
      document.querySelectorAll("#daySelector .day-pill").forEach(p => p.addEventListener("click", () => p.classList.toggle("selected")));

      document.getElementById("habitForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const id = document.getElementById("habitIdInput").value;
        const name = document.getElementById("habitNameInput").value.trim();
        if (!name) return;

        const scheduleType = document.getElementById("habitScheduleTypeInput").value;
        let daysOfWeek = [0,1,2,3,4,5,6];
        if (scheduleType === "weekdays") daysOfWeek = [1,2,3,4,5];
        else if (scheduleType === "weekends") daysOfWeek = [0,6];
        else if (scheduleType === "custom") {
          daysOfWeek = [...document.querySelectorAll("#daySelector .day-pill.selected")].map(p => Number(p.dataset.day));
          if (daysOfWeek.length === 0) { alert("Select at least one day."); return; }
        }

        const payload = {
          name,
          category: document.getElementById("habitCategoryInput").value,
          icon: document.getElementById("habitIconInput").value || "✅",
          target: document.getElementById("habitTargetInput").value.trim(),
          startDate: document.getElementById("habitStartDateInput").value || getTodayStr(),
          reminder: document.getElementById("habitReminderInput").value,
          scheduleType,
          daysOfWeek
        };

        if (id) {
          const idx = state.habits.findIndex(x => x.id === id);
          if (idx !== -1) state.habits[idx] = { ...state.habits[idx], ...payload };
        } else {
          state.habits.push({ id: generateId(), ...payload, paused: false, createdAt: getTodayStr() });
        }

        saveState();
        document.getElementById("habitModalBackdrop").classList.remove("open");
        renderApp();
        showToast(id ? `💾 Updated: ${name}` : `🎉 Added: ${name}`);
      });

      // Automatically switch active shell when resizing/rotating between Mobile and PC
      let lastMobileState = isMobileDevice();
      window.addEventListener("resize", () => {
        const nowMobile = isMobileDevice();
        if (nowMobile !== lastMobileState) {
          lastMobileState = nowMobile;
          renderApp();
        }
      });

      renderApp();
    })();
  </script>
</body>
</html>
